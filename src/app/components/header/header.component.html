<div class="header-bg text-white" [class.authorised]="(isAuthorised$ | async)">
  <div class="container-fluid container-lg">
    <div class="header-top d-flex align-items-center">

      <svg width="176" height="33" viewBox="0 0 176 33" fill="none" xmlns="http://www.w3.org/2000/svg" routerLink="/products" style="cursor: pointer"><use href="/icons.svg#brand"/></svg>
      <span class="mx-4 d-none d-md-block" style="font-size: 34px;">|</span>
      <span class="d-none d-md-block">GameStockx</span>

      <div class="w-100 d-flex justify-content-end align-items-center">
        @if (isAuthorised$ | async; as user) {

          <div class="chat-entry">
            <button type="button" class="chat-toggle" (click)="toggleChat()" [attr.aria-label]="'Чат. Непрочитанных сообщений: ' + ((unreadCount$ | async) ?? 0)">
              @if (unreadCount$ | async; as count) {
                <span class="chat-unread" aria-live="polite">{{count}}</span>
              }
              <svg width="38" height="34" viewBox="0 0 38 34" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M21 21.3929C21 25.7521 16.968 29.2857 12 29.2857C10.5538 29.2949 9.1221 28.9927 7.80005 28.3993L7.02005 28.7393L3.00007 30.5L4.38007 25.6429C3.47741 24.4148 2.99314 22.9234 3.00007 21.3929C3.00007 17.0336 7.03205 13.5 12 13.5C16.356 13.5 19.992 16.22 20.82 19.8264C20.941 20.3395 21.0014 20.8653 21 21.3929Z" stroke="#68A9EF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
          </div>

          <a class="profile-link" routerLink="/profile" aria-label="Мой профиль" title="Мой профиль">
            <app-user-avatar class="desktop-avatar" [login]="currentUser$ | async"/>
            <svg class="mobile-profile" aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="8" r="4"/><path d="M4 22v-2a8 8 0 0 1 16 0v2"/></svg>
            <span class="profile-login">{{ currentUser$ | async }}</span>
          </a>
          <a class="btn-blue px-2 small" role="button" tabindex="0" (keydown.enter)="logout()" (click)="logout()">
            Выйти
          </a>
        } @else {
          <a class="btn-blue px-2 small" routerLink="/login">
            Войти
          </a>
        }
      </div>
    </div>
  </div>

  <div style="background-color: rgba(0, 0, 0, 0.5);">
    @if (isAuthorised$ | async;) {
      <div class="container-fluid container-lg">
        <div class="row align-items-center" style="min-height: 60px; padding: 12px 0;">
          <!-- Лого и кнопки -->
          <div class="col primary-navigation">
            <a class="kudos-challenge-link" routerLink="/kudos-challenge" routerLinkActive="nav-active">Kudos Challenge <app-kudos [login]="currentUser$ | async" [compact]="true"/></a>
            <!-- Кнопка "Каталог" -->
            <a class="nav-link text-white d-flex align-items-center" routerLink="/products" routerLinkActive="nav-active" [routerLinkActiveOptions]="{exact: true}">
              Каталог
            </a>


            <a class="text-white d-flex align-items-center" routerLink="/collectors" routerLinkActive="nav-active" [routerLinkActiveOptions]="{exact: true}">
              Игроки
            </a>

            <a class="text-white align-items-center d-none d-md-flex" routerLink="/collection" routerLinkActive="nav-active" [routerLinkActiveOptions]="{exact: true}">
              Моя коллекция
            </a>

            <a class="text-white d-flex align-items-center d-md-none" routerLink="/collection" routerLinkActive="nav-active" [routerLinkActiveOptions]="{exact: true}">
              Мое
            </a>

            <a class="text-white d-flex align-items-center" routerLink="/wishlist" routerLinkActive="nav-active" [routerLinkActiveOptions]="{exact: true}">
              Вишлист
            </a>

            <a class="text-white d-flex align-items-center" routerLink="/wts" routerLinkActive="nav-active" [routerLinkActiveOptions]="{exact: true}">
              Хочу продать
            </a>
          </div>
        </div>
      </div>
    }
  </div>
</div>
