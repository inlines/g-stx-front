@for (toast of toastService.toasts; track toast) {
  <ngb-toast
    [header]="toast?.header || ''"
    [class]="toast.classname"
    [delay]="toast.delay || 500000000"
    (hidden)="toastService.remove(toast)"
    >
    {{ toast.body }}
    @if (toast.route) {
      <a [routerLink]="toast.route" [queryParams]="toast.queryParams" (click)="toastService.remove(toast)">{{ toast.actionLabel }}</a>
    }
  </ngb-toast>
}
